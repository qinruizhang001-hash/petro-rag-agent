# ─────────────────────────────────────────────────────────────
# CCUS 系统统一入口：一个端口，两个后端
#
#   /api/*  → backend:8000   （FastAPI，SSE 流）
#   /*      → frontend:8501  （Streamlit，WebSocket）
#
# 为什么需要它（不只是"多个网关"）：
#   · 同源。浏览器只看到 http://host:8080 一个来源，Streamlit 调后端不再是
#     跨域请求，CORS 从"要正确配置"变成"根本不存在"。
#   · 端口收敛。外部只需要开一个口，8000/8501 可以退回到回环地址。
#   · 为负载均衡留位置：upstream 块加 server 就是水平扩容。
#
# 这个文件里有两组参数不是调优，是**不写就坏**：
#
#   1. SSE（/api/）：proxy_buffering 必须 off。
#      nginx 默认会攒够 buffer 再往下发，于是"流式报告"变成"等 90 秒，
#      然后整篇一起出现"。功能没坏，体验全失 —— 最难查的一类配置问题。
#
#   2. WebSocket（/）：必须转发 Upgrade/Connection 头。
#      少了它们，Streamlit 页面能打开但永远停在 "Please wait..."，
#      因为它的前端与后端之间走的是 ws，不是 http。
# ─────────────────────────────────────────────────────────────

worker_processes auto;
# 前台运行由 nginx 官方镜像的 entrypoint 处理；这里只保证错误输出可见
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里带上游耗时与缓存命中，排查"慢在哪一段"时不用猜
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 项目描述是纯文本，20 MB 已经远超实际需要；设上限是防滥用，不是功能
    client_max_body_size 20m;

    # WebSocket 升级：有 Upgrade 头就 upgrade，没有就正常 close。
    # 直接用 map 而不是在 location 里写死 "upgrade" —— 写死会让普通 HTTP
    # 请求也带 Connection: upgrade，部分上游会因此拒绝请求。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
        # 与后端保持长连接：每次请求重新建 TCP 在 SSE 场景下纯属浪费
        keepalive 32;
    }

    upstream frontend {
        server frontend:8501;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 代理自身的存活探针。不转发给任何人，所以后端全挂时它仍然是 200 ——
        # 这正是"网关活着"和"业务健康"要分开报告的原因。
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── FastAPI 根级端点（/docs、/health 等不在 /api/ 前缀下）──
        location = /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        location = /docs {
            proxy_pass http://backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        location = /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # ── FastAPI：/api/* ──────────────────────────────────
        location /api/ {
            # 不带 URI 后缀 = 原样转发 /api/analyze，后端路由本来就是 /api/...
            # 写成 proxy_pass http://backend/ 会把前缀吃掉，变成 /analyze → 404
            proxy_pass http://backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 复用 upstream keepalive 时必须清掉逐跳的 Connection 头
            proxy_set_header Connection        "";

            # ↓ 这两行是 SSE 的全部秘密：不缓冲、不缓存
            proxy_buffering off;
            proxy_cache     off;

            # 一次完整评估含反思循环实测 90-150 s；给到 900 s 是为了
            # 覆盖"CPU 推理 + 重写一轮"的最坏情况，而不是让它刚好够用。
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # ── Streamlit：其余全部 ─────────────────────────────
        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;
            # Streamlit 用 Origin 头做 XSRF 校验，必须把**带端口**的 Host 传进去。
            # $host 会丢掉 :8080，导致 Origin 与 Host 对不上而报 "Invalid origin"。
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket（/_stcore/stream）：少了这两行页面永远转圈
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 流式输出与长连接
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
