# ─────────────────────────────────────────────────────────────
# 一键拉起整个 CCUS 系统
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# 五个容器，但只有一个对外：
#
#   nginx       统一入口 :8080（容器内 80）—— 唯一暴露给外部用户的端口
#   frontend    Streamlit :8501，只绑回环，经 nginx 访问
#   backend     FastAPI  :8000，只绑回环，经 nginx 访问；gunicorn 4 worker
#   ollama      本地推理 :11434，只绑回环（调试用）
#   ollama-pull 一次性 job：把模型拉进 ollama 的 volume，拉完即退出
#
# 端口为什么是 8080 而不是 80：
#   80 需要 root/管理员权限，Windows 上还常被 IIS 或其它服务占用。
#   要换成 80 只改 nginx 的 ports 一行（"80:80"），其余不动。
#
# 网络契约（整个文件里最重要的几行）：
#   nginx    → http://backend:8000       /api/* 走这里
#   nginx    → http://frontend:8501      其余全部走这里
#   frontend → http://backend:8000       Streamlit 服务端代发请求
#   backend  → http://ollama:11434/v1    localhost 在容器里指的是容器自己
#   宿主机   → localhost:8080            浏览器唯一需要知道的地址
#
# 模型与图谱不进镜像，靠 volume 挂载；体积与原因见 Dockerfile 顶部注释。
# ─────────────────────────────────────────────────────────────
name: ccus

services:
  # ───────────────────────────────────────────────────────────
  # Ollama：本地推理
  # ───────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ccus-ollama
    ports:
      # 只绑回环：给调试用（curl 一下 /api/tags），不对外。要对外删掉这行。
      - "127.0.0.1:11434:11434"
    volumes:
      # 模型权重（qwen2.5 约 4.7 GB + nomic-embed-text 约 274 MB）住在这里。
      # 命名 volume 而不是 bind mount：Windows/macOS 上 bind mount 一个几 GB
      # 的模型目录，首次写入会慢到以为卡死。
      - ollama_models:/root/.ollama
    environment:
      # 默认 5 分钟空闲就卸载模型，下一次请求要重新加载（7B 冷启动 10-30 s）。
      # 演示场景下保持常驻更划算。
      OLLAMA_KEEP_ALIVE: 30m
      # 并行请求数。默认 1 时，fan-out 的两个分支会在 Ollama 里排队，
      # "并行"只剩图结构上的并行。调成 2 让两路真正同时推理 ——
      # 代价是 KV cache 翻倍，内存紧张就调回 1。
      OLLAMA_NUM_PARALLEL: 2
    healthcheck:
      # 官方镜像里没有 curl/wget，用 ollama 自己的 CLI 探活
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────
  # 一次性任务：确保两个模型都在
  # ───────────────────────────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ccus-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # CLI 默认连 127.0.0.1:11434，在容器里那是它自己
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      # 注意：这里不能写 shell 变量。compose 在把 YAML 交给 shell 之前会先做一次
      # 变量插值，脚本里以美元符开头的名字会被替换成空串，命令静默变形。
      # 真要保留字面量美元符，必须写两遍。这里索性展开成两行，不给自己留坑。
      - |
        set -e
        ollama list | grep -q '^qwen2.5' || ollama pull qwen2.5
        ollama list | grep -q '^nomic-embed-text' || ollama pull nomic-embed-text
        echo "[pull] 模型就绪"
    restart: "no"

  # ───────────────────────────────────────────────────────────
  # 后端：FastAPI + LangGraph 多智能体（gunicorn 4 worker）
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petro-rag-agent:latest
    container_name: ccus-backend
    # gunicorn 而不是 uvicorn：需要 master 进程管理（worker 崩溃自动拉起、
    # 优雅重启）。worker 数、超时、worker_class 都在 gunicorn.conf.py 里，
    # 那里也写了"为什么 4 个 worker 需要 24 GB 内存"。
    command: ["gunicorn", "api_server:api", "--config", "gunicorn.conf.py"]
    ports:
      # 只绑回环：/docs 和 curl 调试用。外部用户一律走 nginx。
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    environment:
      # 容器网络契约，钉死在这里而不是放在 .env.docker：
      # 用户改调参可以随便改那个文件，但把服务名改成 localhost 会让整个栈失联，
      # 这类值不值得开放给"顺手改一下"。
      OLLAMA_BASE_URL: http://ollama:11434/v1
      # 代码里的默认值是 D:\python-learn\chroma_petro（Windows 绝对路径），
      # 在 Linux 容器里不覆盖它，chromadb 会建一个名字里带反斜杠的目录。
      CCUS_CHROMA_PATH: /app/chroma_petro
      # 文件记忆指向挂载目录而不是仓库根目录。原因见下面 volumes 的注释：
      # 单文件 bind mount 不能做原子替换。
      PROJECT_HISTORY_PATH: /app/state/project_history.md
      USER_PROFILE_PATH: /app/state/user_profile.md
    depends_on:
      ollama:
        condition: service_healthy
      # 模型没拉完就不启动后端：否则第一次请求才炸，且错误指向 Ollama 而非这里
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      # 2.2 GB 的 reranker，只读挂载 —— 镜像里不该有第二份
      - ./models:/app/models:ro
      - ./lightrag_storage:/app/lightrag_storage
      - ./chroma_petro:/app/chroma_petro
      - ./charts:/app/charts
      - ./logs:/app/logs
      # 自我进化：experiences.jsonl / semantic_memory.json 必须跨容器重建保留，
      # 否则"系统从自己的历史里学到的先验"每次 up 都归零
      - ./history:/app/history
      # 文件记忆：**必须挂目录，不能挂单个文件**。
      # file_memory.py 的重写走"临时文件 + os.replace"，而 os.replace 作用在
      # 一个 bind mount 的**文件**上会返回 EBUSY（挂载点不能被替换）。症状是
      # 历史压缩那一步失败、历史悄悄停止增长 —— 不报错，只是不再记忆。
      # 挂目录就没有这个问题：rename 发生在同一个挂载的文件系统内部。
      # 目录名刻意不叫 memory/：那是本仓库的 Python 包，挂上去等于把代码挂掉。
      - ./state:/app/state
    healthcheck:
      # /health 会真的去 ping Ollama / 列 Chroma 集合 / 读 checkpoint.db，
      # 所以 timeout 从 5s 放到 10s：依赖挂掉时探针要能跑完并**报告**降级，
      # 而不是被超时判死。它永远返回 200，降级写在 body 里。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      # 4 个 worker 各自加载 2.2 GB 模型，冷启动比单进程更久
      start_period: 120s
      retries: 3
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────
  # 前端：Streamlit 监控台
  # ───────────────────────────────────────────────────────────
  frontend:
    # 复用后端刚构建好的镜像：两个服务环境完全一致，
    # 不会出现"前端能跑、后端不能跑"。没有 build: 段是有意的 ——
    # docker compose up 会先把带 build 的服务构建完，再来启动这个。
    image: petro-rag-agent:latest
    container_name: ccus-frontend
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      # 只绑回环：经 nginx 才是正常入口。留着是为了直连排查
      # （比如确认到底是前端挂了还是 nginx 转发错了）。
      - "127.0.0.1:8501:8501"
    # 前端也要读 API_TOKEN，且必须和后端**同一个值**。
    # 两边读同一个 env_file 是唯一能保证"不会只改一边"的做法。
    env_file:
      - .env.docker
    environment:
      # 唯一一行真正决定"前端能不能连上后端"的配置。
      # 写成 127.0.0.1:8000 会连到前端容器自己 —— 这是 Docker 里最常见的一类错误，
      # 症状是页面上一直显示"后端未连接"，而两个容器各自都是健康的。
      API_BASE_URL: http://backend:8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────
  # Nginx：统一入口
  # ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ccus-nginx
    ports:
      # 唯一对外的端口。改成 "80:80" 就能用 http://localhost 访问。
      - "8080:80"
    volumes:
      # 只读挂载：配置是代码，容器里不该改
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # 两个上游都得健康再起网关，否则 nginx 启动时解析不到 upstream 主机名
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 没有 curl，用 busybox 自带的 wget
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  # 模型权重放在命名 volume 里：跨 `docker compose down` 保留，
  # 只有 `down -v` 才会删（删了就要重新拉 5 GB）。
  ollama_models:
