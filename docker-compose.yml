# ─────────────────────────────────────────────────────────────
# 一键拉起整个 CCUS 系统
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# 四个容器，但只有一个对外：
#
#   nginx       统一入口 :8080（容器内 80）—— 唯一暴露给外部用户的端口
#   frontend    Streamlit :8501，只绑回环，经 nginx 访问
#   backend     FastAPI  :8000，只绑回环，经 nginx 访问；gunicorn 1 worker（强制）
#
# Ollama 不在这里 —— 复用宿主机那一份。两个原因，都不是偏好：
#   1) 内存。这台机器 15.5 GB，2×2.2 GB 的 reranker 已经吃掉 4.4 GB，
#      再塞一个常驻的 Ollama（qwen2.5 约 4 GB）会挤到换页。
#   2) GPU。容器里的 Ollama 拿不到 RTX 5060（没有直通），7B 模型退回 CPU，
#      地质分支从 70 秒变成几分钟。宿主机那份已经在用 CUDA，模型也下好了。
#
# 代价：换机器要先装 Ollama 并 `ollama pull qwen2.5 nomic-embed-text`。
# 想恢复完全自包含，把「容器内 Ollama」注释段恢复即可（worker 数不要动）。
#
# 端口为什么是 8080 而不是 80：
#   80 需要 root/管理员权限，Windows 上还常被 IIS 或其它服务占用。
#   要换成 80 只改 nginx 的 ports 一行（"80:80"），其余不动。
#
# 网络契约（整个文件里最重要的几行）：
#   nginx    → http://backend:8000                 /api/* 走这里
#   nginx    → http://frontend:8501                其余全部走这里
#   frontend → http://backend:8000                 Streamlit 服务端代发请求
#   backend  → http://host.docker.internal:11434/v1  宿主机的 Ollama
#   宿主机   → localhost:8080                      浏览器唯一需要知道的地址
#
# 关于 host.docker.internal：它是 Docker Desktop 提供的宿主别名，指向宿主机
# 的**非回环**地址。所以 Ollama 必须以 OLLAMA_HOST=0.0.0.0:11434 启动 ——
# 绑在 127.0.0.1 上容器就连不上，而症状只是 Connection refused，看起来
# 像"Ollama 根本没启动"，很容易查错方向。
#
# 模型与图谱不进镜像，靠 volume 挂载；体积与原因见 Dockerfile 顶部注释。
# ─────────────────────────────────────────────────────────────
name: ccus

services:
  # ───────────────────────────────────────────────────────────
  # 后端：FastAPI + LangGraph 多智能体（gunicorn）
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petro-rag-agent:latest
    container_name: ccus-backend
    # gunicorn 而不是 uvicorn：需要 master 进程管理（worker 崩溃自动拉起、
    # 优雅重启）。worker 数、超时、worker_class 都在 gunicorn.conf.py 里。
    command: ["gunicorn", "api_server:api", "--config", "gunicorn.conf.py"]
    ports:
      # 只绑回环：/docs 和 curl 调试用。外部用户一律走 nginx。
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    environment:
      # 容器网络契约，钉死在这里而不是放在 .env.docker：
      # 用户改调参可以随便改那个文件，但把服务名改成 localhost 会让整个栈失联，
      # 这类值不值得开放给"顺手改一下"。
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      # worker 数**必须是 1**，这不是性能调参，是 checkpoint.db 的写者约束：
      # SqliteSaver 跨进程没有互斥，两个 worker 并发写同一个库会以
      # "attempt to write a readonly database" 失败（实测 2 进程 × 60 次写 × 10 轮
      # = 1,200 次写里失败 3 次；加 WAL + busy_timeout 仍是 3 次）。
      # 失败点在每个节点的 checkpoint 写入，所以后果不只是 HITL 续跑失败，
      # 而是任意一次评估可能中途崩掉。
      #
      # 并发不受影响：UvicornWorker 在事件循环里并发，重活在 asyncio.to_thread
      # 里跑。多开 worker 唯一确定买到的是每个进程各一份 2.2 GB 的 reranker。
      # gunicorn.conf.py 还会把它强制降到 1 并打印原因，这里写 1 是为了让
      # 读 compose 的人不必再去看那个文件。
      WEB_CONCURRENCY: 1
      # 代码里的默认值是 D:\python-learn\chroma_petro（Windows 绝对路径），
      # 在 Linux 容器里不覆盖它，chromadb 会建一个名字里带反斜杠的目录。
      CCUS_CHROMA_PATH: /app/chroma_petro
      # 文件记忆指向挂载目录而不是仓库根目录。原因见下面 volumes 的注释：
      # 单文件 bind mount 不能做原子替换。
      PROJECT_HISTORY_PATH: /app/state/project_history.md
      USER_PROFILE_PATH: /app/state/user_profile.md
    # Docker Desktop 自带 host.docker.internal；显式写一遍是为了在 Linux 上
    # 跑同一份 compose 时不至于解析失败（那边需要 host-gateway 映射）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 2.2 GB 的 reranker，只读挂载 —— 镜像里不该有第二份
      - ./models:/app/models:ro
      - ./lightrag_storage:/app/lightrag_storage
      - ./chroma_petro:/app/chroma_petro
      - ./charts:/app/charts
      - ./logs:/app/logs
      # 自我进化：experiences.jsonl / semantic_memory.json 必须跨容器重建保留，
      # 否则"系统从自己的历史里学到的先验"每次 up 都归零
      - ./history:/app/history
      # 文件记忆：**必须挂目录，不能挂单个文件**。
      # file_memory.py 的重写走"临时文件 + os.replace"，而 os.replace 作用在
      # 一个 bind mount 的**文件**上会返回 EBUSY（挂载点不能被替换）。症状是
      # 历史压缩那一步失败、历史悄悄停止增长 —— 不报错，只是不再记忆。
      # 挂目录就没有这个问题：rename 发生在同一个挂载的文件系统内部。
      # 目录名刻意不叫 memory/：那是本仓库的 Python 包，挂上去等于把代码挂掉。
      - ./state:/app/state
    healthcheck:
      # /health 会真的去 ping Ollama / 列 Chroma 集合 / 读 checkpoint.db，
      # 所以 timeout 从 5s 放到 10s：依赖挂掉时探针要能跑完并**报告**降级，
      # 而不是被超时判死。它永远返回 200，降级写在 body 里。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      # 冷启动要加载 2.2 GB 的 reranker，比纯 API 服务久
      start_period: 120s
      retries: 3
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────
  # 前端：Streamlit 监控台
  # ───────────────────────────────────────────────────────────
  frontend:
    # 复用后端刚构建好的镜像：两个服务环境完全一致，
    # 不会出现"前端能跑、后端不能跑"。没有 build: 段是有意的 ——
    # docker compose up 会先把带 build 的服务构建完，再来启动这个。
    image: petro-rag-agent:latest
    container_name: ccus-frontend
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      # 只绑回环：经 nginx 才是正常入口。留着是为了直连排查
      # （比如确认到底是前端挂了还是 nginx 转发错了）。
      - "127.0.0.1:8501:8501"
    # 前端也要读 API_TOKEN，且必须和后端**同一个值**。
    # 两边读同一个 env_file 是唯一能保证"不会只改一边"的做法。
    env_file:
      - .env.docker
    environment:
      # 唯一一行真正决定"前端能不能连上后端"的配置。
      # 写成 127.0.0.1:8000 会连到前端容器自己 —— 这是 Docker 里最常见的一类错误，
      # 症状是页面上一直显示"后端未连接"，而两个容器各自都是健康的。
      API_BASE_URL: http://backend:8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────
  # Nginx：统一入口
  # ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ccus-nginx
    ports:
      # 唯一对外的端口。改成 "80:80" 就能用 http://localhost 访问。
      - "8080:80"
    volumes:
      # 只读挂载：配置是代码，容器里不该改
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # 两个上游都得健康再起网关，否则 nginx 启动时解析不到 upstream 主机名
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 没有 curl，用 busybox 自带的 wget
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

# 没有顶层 volumes：Ollama 的模型权重现在住宿主机的 ~/.ollama，
# 由宿主机那份 Ollama 管理，不归这个栈管。
# 其余持久化数据都走 bind mount（见 backend 的 volumes），
# 因为它们在仓库里、需要能直接打开看。
