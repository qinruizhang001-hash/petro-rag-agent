name: E2E (manual)

# 中文注释：端到端回归测试需要「本地 Ollama + 已构建的图谱索引」，
# GitHub 托管 runner 无法提供，因此只能手动触发，且必须跑在自建 runner 上。
# 用法：仓库 Settings → Actions → Runners 注册一台带 Ollama 的机器，
# 然后 Actions → E2E (manual) → Run workflow。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'run' to confirm this needs a local Ollama + built graph"
        required: true
        default: ""

jobs:
  e2e:
    name: Full pipeline regression
    if: github.event.inputs.confirm == 'run'
    runs-on: [self-hosted]
    # 10 道题的 RAGAS 评估每题要跑完整工作流（含可能的自检重检），
    # 30 分钟不够；这里给足余量，避免跑到一半被 GitHub 砍掉。
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Verify local Ollama is reachable
        run: curl -sf http://127.0.0.1:11434/api/tags > /dev/null

      - name: Verify graph index exists
        run: test -d lightrag_storage || { echo "::error::Run graph_rag_test.py first"; exit 1; }

      - name: Run 138-assertion E2E suite
        run: python test_graph_rag_e2e.py

      - name: Install RAGAS evaluation dependencies
        run: python -m pip install -r requirements-eval.txt

      # RAGAS 的忠实度 prompt 要同时装下「全部检索证据 + 整篇报告」，
      # Ollama 默认 4096 窗口装不下（实测 5387 tokens 被 400 拒绝）。
      # 用同一个权重建一个 16k 上下文的评判变体，只改 num_ctx，不复制权重。
      # 8k 实测不够：证据 8852 字（≈4.4k token）+ 报告 1500 字（≈0.8k token）
      # 之后只剩不到 3k 给输出，陈述列表一旦偏长就被截断。
      - name: Build wide-context judge model
        env:
          RAGAS_JUDGE_MODEL: qwen2.5-16k
        run: |
          printf 'FROM %s\nPARAMETER num_ctx 16384\n' "${LOCAL_MODEL:-qwen2.5}" > /tmp/Modelfile.judge
          ollama create "$RAGAS_JUDGE_MODEL" -f /tmp/Modelfile.judge

      - name: Run RAGAS Golden Set quality gate
        env:
          RAGAS_JUDGE_MODEL: qwen2.5-16k
        run: python eval_ragas.py --threshold 0.8 --output eval/ragas_report.json

      - name: Upload RAGAS evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-report
          path: eval/ragas_report.json
          if-no-files-found: ignore
