  unit-api:
    name: Unit tests · ops API (fastapi, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：这一组测的是运维接口（api_ops）本身，只装 fastapi + httpx。
      #
      # 为什么**不**放进 unit-core：那个 job 的契约是"零三方包"，混进来会破坏它。
      # 为什么**不**放进 unit-deps：那边装的是 openai/ragas 那条评估链，
      # 与接口无关；而接口测试要的是"起一个只挂 ops 路由的裸 FastAPI"，
      # 装得越少越能证明 api_ops 没有被重模型拖累。
      #
      # 这也正是 api_ops 从 api_server 里拆出来的原因：api_server 顶部
      # `from workflow import ...` 会加载 LangGraph 全图与 2.2 GB 重排模型，
      # 接口测试在 CI 里根本跑不起来。测试只 import api_ops，不 import api_server。
      - name: Install API dependencies
        run: python -m pip install --quiet "fastapi>=0.110.0" httpx

      - name: Confirm this environment has no torch (the point of this job)
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("torch", "sentence_transformers", "chromadb", "langgraph"):
              print(f"{mod:24} {'present' if u.find_spec(mod) else 'absent (expected)'}")
          PY

      - name: Run ops API tests
        run: python -m unittest -v tests.test_api_ops

      # 中文注释：知识库接口（api_kb）与它依赖的纯函数层（kb_evidence）放在
      # 同一个 job 里，因为它们共享同一条依赖边界：只用 fastapi + stdlib。
      #
      # 这里能跑起来本身就是一个断言 —— 如果 api_kb 哪天在模块顶层
      # import 了 lightrag 或 chromadb（首屏为了一个 COUNT(*) 付 1.2 秒），
      # 这个 job 会在 import 阶段就炸，而不是等到线上才发现首屏变慢。
      - name: Run knowledge base API tests
        run: python -m unittest -v tests.test_api_kb tests.test_kb_evidence

  unit-deps:
    name: Unit tests · eval & config (real deps, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：这一组测的是"真的会 import 三方包"的模块，但**仍然不需要 torch**：
      # - test_model_router    → core.config 建 OpenAI 客户端（要 openai + dotenv）
      # - test_evaluate_budget → nodes.evaluate_node → core.config（同上），
      #                          并用 tiktoken 做真实的 token 预算核算
      # - test_eval_ragas      → eval_ragas 的评判校准（要 ragas + numpy）
      #
      # 为什么它们不能待在 unit-core：那个 job 的契约是"零三方包"，
      # 一旦混进来，3.10/3.11/3.12 三个版本会一起变红，而且红的原因
      # 与核心逻辑无关，只会掩盖真正的回归。
      #
      # 为什么不需要 torch：utils/tokens 曾经在模块顶层 import core.reranker，
      # 于是"读个配置"也要加载 2.2 GB 的 CrossEncoder。现在 reranker 只在
      # tiktoken 缺席时按需导入，这条链路才得以在没有模型的机器上跑通。
      - name: Install evaluation and client dependencies
        run: |
          python -m pip install --quiet python-dotenv openai tiktoken numpy
          python -m pip install --quiet -r requirements-eval.txt

      - name: Confirm this environment has no torch (the point of this job)
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("torch", "sentence_transformers", "chromadb"):
              print(f"{mod:24} {'present' if u.find_spec(mod) else 'absent (expected)'}")
          PY

      - name: Run dependency-backed unit tests
        run: |
          python -m unittest -v \
            tests.test_model_router \
            tests.test_evaluate_budget \
            tests.test_eval_ragas

  unit-graph:
    name: Unit tests · gate + whole-graph negative case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：这一组只装 langgraph / openai / dotenv —— 不装 torch、
      # 不装 chromadb、不需要 Ollama。tests/_graph_stubs.py 在 import 之前把
      # 叶子模块（reranker / 向量库 / MCP / 图表）换成桩，因此这里跑的是
      # **真实的 workflow.py 拓扑 + 真实的 physics_rules + 真实的闸门判定**。
      #
      # 为什么必须放在 push 路径上：闸门是"错了会出事"的那部分，它的负向回归
      # 之前只存在于 e2e.yml（自建 runner、手动触发），结果连续几周没人跑。
      - name: Install graph-only dependencies
        run: python -m pip install --quiet -r requirements-graph.txt

      - name: Show what this environment cannot load (should be torch/chromadb)
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("torch", "sentence_transformers", "chromadb"):
              print(f"{mod:24} {'present' if u.find_spec(mod) else 'absent (expected)'}")
          PY

      - name: Run the hard gate + whole-graph negative test
        run: python -m unittest -v tests.test_quality_gate tests.test_negative_gate

  unit-charts:
    name: Unit tests · chart tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：图表工具真的依赖 matplotlib，装它就是承认这个事实，
      # 而不是把测试排除掉假装没有这层依赖。
      # matplotlib 在无显示环境靠 Agg 后端，chart_tools 里已强制设置。
      - name: Install chart dependencies
        # plotly 是前端曲线的依赖：ui_components 里那三张图要真的构造出来才算测过。
        run: python -m pip install --quiet matplotlib plotly

      - name: Verify Agg backend is headless-safe
        run: |
          python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          fig, ax = plt.subplots()
          ax.plot([0, 1], [0, 1])
          fig.savefig("/tmp/_probe.png")
          print("Agg backend OK, headless rendering works")
          PY

      - name: Run chart unit tests
        run: python -m unittest -v tests.test_chart_tools tests.test_ui_components

  web:
    name: Web console · typecheck, build, fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：fixture 是**真实接口响应的快照**，由
      # scripts/capture_ops_fixtures.py 用 TestClient 抓取。手写 fixture 会和契约
      # 悄悄分家 —— 后端字段改名、枚举多一个值，前端继续渲染那份"看起来还对"的
      # 旧数据，而没有任何东西会红。这一步把它变成硬失败。
      - name: Frontend fixtures still match the live API
        run: |
          python -m pip install --quiet "fastapi>=0.110.0" httpx
          python scripts/capture_ops_fixtures.py --check
          # 中文注释：知识库 fixture 分四层，脚本自己判断这一台机器能做到哪一层 ——
          #   search.json 逐字节  需要 Ollama，CI 没有 → 跳过并打印原因
          #   search.json 结构与自洽  不需要模型（来源表由切片重算、stats 是计数、
          #     text_quality 由正文算出）→ **CI 里真跑的那一层**。手改一个
          #     reference_id、删一条切片忘了改 stats，界面都照样渲染，只是每处
          #     引用都指错 —— 这一层查的就是这个
          #   overview/documents 逐字节  内容来自 ccus_docs/ 与 lightrag_storage/，
          #     而 ccus_docs/*.pdf 与图谱**按设计不入仓库**（PDF 有版权、图谱 GB 级），
          #     所以 CI 里的语料只有 1 篇。逐字节比对在这种环境注定失败，
          #     而永远红的检查会训练人忽略整个 job → 跳过并打印原因
          #   字段集合  与语料无关，任何时候都比对
          # 每一种情形都必须说出来。只说"未比对"会抹掉真做过的检查，
          # 只说"已比对"会替没做的检查背书。
          python scripts/capture_kb_fixtures.py --check

      # 中文注释：审批状态机的契约（web/src/fixtures/approval.json）与演示草稿
      # （web/src/fixtures/reports.json）都是 scripts/export_approval_contract.py
      # **在四个状态上逐个动作真跑一遍**导出来的，不是人写的。
      #
      # 这一步守的是一类特别安静的失效：后端给 reports.py 加了一条迁移
      # （比如允许 approved → draft 做更正），前端那张表不会跟着变。
      # 表现是按钮点不动、或者点下去 409 —— 两种情况都不报错，
      # 只在真实审批时被发现，而那时已经有人在电话里说"我批了"。
      #
      # 需要 fastapi（用 TestClient 走真实端点产出草稿），已在上一步装过。
      - name: Approval contract still matches ops/reports.py
        run: python scripts/export_approval_contract.py --check

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      # 中文注释：`text-sev-${token}` 这种拼接在运行时是对的，但 Tailwind 是
      # **编译期扫描源码文本**生成 CSS 的，扫不到模板字符串。症状是六级语义色
      # 全部失效、文字继承父级，而且没有任何报错。所以这里逐个断言它们在产物里。
      - name: Every severity class reached the stylesheet
        working-directory: web
        run: |
          set -e
          for cls in \
            text-sev-normal text-sev-notice text-sev-warn text-sev-alert \
            text-sev-critical text-sev-unknown \
            border-sev-normal border-sev-critical border-sev-unknown \
            bg-sev-unknown
          do
            if ! grep -q -- "$cls" dist/assets/*.css; then
              echo "::error::$cls missing from the built stylesheet — a Tailwind class is being built by concatenation somewhere"
              exit 1
            fi
          done
          echo "All six severity classes are in the stylesheet."

      # 中文注释：窄屏下限必须活到产物里。
      #
      # 背景：单列布局下 grid 行是 `auto` 高度，而 Panel 的 body 是
      # `flex-1 min-h-0` —— `flex: 1 1 0%` 会假设父级高度为 0，于是整块面板
      # 缩成只剩一条标题栏。实测 900 px 宽下左栏 18 条告警、注入压力上限、
      # 盲区提示全部消失，**控制台零报错、构建照样成功**。
      # 唯一的防线就是每个 grid item 上的 `min-h-[420px] lg:min-h-0`。
      #
      # 为什么查 CSS 声明而不是查类名：产物里类名是 `.min-h-\[420px\]`，
      # 反斜杠转义会让 `grep -F` 与肉眼都误判（本项目踩过：`grep -c -F
      # "min-h-\[440px\]"` 返回 0，实际产物里有）。查 `min-height:420px`
      # 这条声明没有转义，类名被删时它也一定跟着消失。
      #
      # 这条守卫锁的是"下限存在"，不是某个具体类名。若将来改用 CSS 变量或
      # 别的写法实现同样效果，请同步改这里 —— 别直接删掉它。
      - name: Narrow-screen floors survive the build
        working-directory: web
        run: |
          set -e
          for decl in \
            "min-height:520px" \
            "min-height:440px" \
            "min-height:480px"
          do
            if ! grep -q -- "$decl" dist/assets/*.css; then
              echo "::error::$decl missing from the built stylesheet — the narrow-screen floor is gone; below ~900 px the left rail collapses to its header and the alarms silently disappear"
              exit 1
            fi
          done
          # 三档栅格的 lg 行高（按视口比例、带 px 下限）与 xl 单行。
          # 用正则而不是写死 `36vh`：这个比例是要调的（画布高度不够时会改），
          # 但"整个表达式被删掉"必须能抓到。
          if ! grep -qE 'minmax\([0-9]+px,[0-9]+vh\)' dist/assets/*.css; then
            echo "::error::the lg row height (minmax(Npx, Mvh)) is gone — the right rail is no longer sized against the viewport, and the section canvas gets squeezed"
            exit 1
          fi
          if ! grep -q -- "minmax(0,1fr)" dist/assets/*.css; then
            echo "::error::minmax(0,1fr) missing — grid rows are back to auto and the section canvas will be stretched to content height"
            exit 1
          fi
          echo "Narrow-screen floors and the layout grid are in the stylesheet."

      # 中文注释：three 压缩后约 130 KB gzip / 508 KB 未压缩。它被**动态 import**
      # 时是一个独立 chunk，首屏先出左栏的告警卡，剖面随后补上；一旦有人把它
      # 改成静态 import，首屏 chunk 会直接涨到 800 KB 以上。
      #
      # 体积线是 320 KB。**它是"有没有大东西被静态 import 进来"的警报，不是
      # 一条需要贴着走的线** —— 当前首屏 317,747 字节（余量 2.3 KB），所以
      # 下一次小改动就可能撞线。撞线时先找原因（多半是某个重面板/大 JSON 被
      # 静态 import 了），**不要直接把数字改大**：改了之后 three 泄漏进来时
      # 它也不会再红。修法通常是 `React.lazy` + 首次激活才挂载，与
      # `ApprovalPanel` / `geoscene` / `KbGapForm` / `SensorTable` 同一套。
      #
      # 上面那个字节数只是"余量有多小"的量级提示，**不是断言**（每加一行
      # 界面代码它就会变）。真正的断言是下面 `-gt 320000` 那一行。
      - name: 3D scene is still code-split
        working-directory: web
        run: |
          set -e
          if ! ls dist/assets/geoscene-*.js >/dev/null 2>&1; then
            echo "::error::no separate geoscene chunk — three is being imported statically again"
            exit 1
          fi
          main=$(ls dist/assets/index-*.js | head -1)
          size=$(stat -c%s "$main")
          echo "first-paint chunk: $main ($size bytes)"
          if [ "$size" -gt 320000 ]; then
            echo "::error::first-paint chunk is $size bytes — something large is being imported statically again (three is the usual suspect; a three leak lands above 800 KB). Do not raise this number: code-split the new panel with React.lazy instead."
            exit 1
          fi

      # 中文注释：知识库的检索 fixture 有 97 KB（12 个切片 + 27 个实体的原文），
      # 它是**动态 import** 的，点"检索"时才拉。改成静态 import 不会报错，
      # 只会让首屏 chunk 涨 78 KB —— 而这个面板在首屏是看不见的
      # （默认停在概览页），用户等于为一个还没打开的页付了下载时间。
      - name: KB search fixture is still code-split
        working-directory: web
        run: |
          set -e
          if ! ls dist/assets/search-*.js >/dev/null 2>&1; then
            echo "::error::no separate search chunk — the KB fixture is imported statically again"
            exit 1
          fi
          echo "search chunk: $(ls dist/assets/search-*.js | head -1)"

      # 中文注释：审批面板（草稿正文 + 审批契约 + 正文解析器）约 58 KB，
      # 它是**动态 import** 的，切到「报告」页签时才拉。改成静态 import
      # 不会报错，只会让首屏 chunk 从 313 KB 涨到 371 KB —— 直接顶破上面
      # 那条 320 KB 的线。所以这里守的是"它还在独立 chunk 里"，
      # 而不是重复守体积（体积那条已经会红）。
      # 中文注释：缺口登记表单约 2 KB，**动态 import**，点了「登记」才拉。
      # 它本身很小，守的不是体积而是"别把它挪回首屏"这个决定 ——
      # 加进首屏时 chunk 从 313,364 涨到 318,649，余量只剩 1.3 KB；
      # 拆出来是 316,879（余量 3.1 KB）。差别不大，但方向要对：
      # 一个只在点击后才出现的表单不该占首屏的预算。
      - name: Gap report form is still code-split
        working-directory: web
        run: |
          set -e
          if ! ls dist/assets/KbGapForm-*.js >/dev/null 2>&1; then
            echo "::error::no separate KbGapForm chunk — the gap report form is being imported statically again"
            exit 1
          fi
          echo "gap form chunk: $(ls dist/assets/KbGapForm-*.js | head -1)"

      # 中文注释：测点全量表约 3.5 KB，**动态 import**，工程师模式点了「表格」
      # 才拉。它本身小，守的不是体积而是"别把它挪回首屏"这个决定 ——
      # 静态 import 时首屏从 317,588 涨到 321,021，直接顶破上面那条线。
      # 与 `KbGapForm` 同一条道理：首屏看不见的东西不占首屏预算。
      - name: Sensor table is still code-split
        working-directory: web
        run: |
          set -e
          if ! ls dist/assets/SensorTable-*.js >/dev/null 2>&1; then
            echo "::error::no separate SensorTable chunk — the sensor table is being imported statically again (first-paint chunk goes back over 320 KB)"
            exit 1
          fi
          echo "sensor table chunk: $(ls dist/assets/SensorTable-*.js | head -1)"

      - name: Approval panel is still code-split
        working-directory: web
        run: |
          set -e
          if ! ls dist/assets/ApprovalPanel-*.js >/dev/null 2>&1; then
            echo "::error::no separate ApprovalPanel chunk — the approval panel (and its 28 KB of draft fixtures) is being imported statically again, so the first paint waits for a page the operator has not opened"
            exit 1
          fi
          echo "approval chunk: $(ls dist/assets/ApprovalPanel-*.js | head -1)"

      # 中文注释：许可证审查。这不是"文档里写一句 MIT"能解决的事 ——
      # GPL 的传染性判断看的是整个依赖树，而这个项目有 143 个包（直接依赖只有 13 个）。
      # 先跑 --self-test：一张写错的正则表会让所有包都判为放行，然后这个绿灯
      # 就替一次没做的检查背书了。先证明判定规则本身有效，再拿它去判。
      - name: Dependency licences are commercially usable
        working-directory: web
        run: |
          set -e
          node scripts/audit-licenses.mjs --self-test
          node scripts/audit-licenses.mjs

      # 中文注释：渲染质量的降档判定。它写错了不会报错、不会崩、界面上也看不出
      # 区别 —— 只会在某台集显机器上一直掉帧，而那个本该发生的降级从来没发生。
      # 纯函数 + node:test，不需要浏览器。
      - name: Render quality controller
        working-directory: web
        run: npm test

  frontend-contract:
    name: Frontend/backend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check API contract matches frontend client
        run: |
          set -e
          # 中文注释：前端只允许通过 HTTP 调后端，禁止重新引入领域逻辑。
          # 后端地址必须可配置（本地 127.0.0.1:8000 / Docker 里 api:8000），
          # 所以这里断言的是"默认回环地址 + 端点路径"两件事，而不是某个写死的 URL。
          grep -q 'http://127.0.0.1:8000' app.py \
            || { echo "::error::app.py lost its default backend address"; exit 1; }
          grep -q 'API_BASE_URL' app.py \
            || { echo "::error::app.py must read API_BASE_URL (needed by Docker Compose)"; exit 1; }
          grep -q '/api/analyze' app.py \
            || { echo "::error::app.py no longer targets the backend API"; exit 1; }
          grep -q '/api/analyze' api_server.py \
            || { echo "::error::api_server.py lost the /api/analyze route"; exit 1; }
          for banned in langgraph chromadb lightrag ollama sentence_transformers matplotlib; do
            if grep -qiE "^(import|from) +$banned" app.py; then
              echo "::error::app.py must stay a pure HTTP client (found: $banned)"; exit 1
            fi
          done
          # 中文注释：成本文案必须由后端算好再下发。若前端自己按单价重算，
          # "成本"与"节省"两个数字就会来自两次计算，量级错配极难发现。
          grep -q 'cost_estimation' app.py \
            || { echo "::error::app.py must render cost_estimation from the backend"; exit 1; }
          grep -q 'st.caption' app.py \
            || { echo "::error::app.py lost the cost caption"; exit 1; }
          # 中文注释：物理校验的阻断结论必须能被用户看见，不能被吞在详情里。
          grep -q 'physics_check' app.py \
            || { echo "::error::app.py must surface physics_check"; exit 1; }
          # 中文注释：PINN 数值同理 —— 报告正文里那句话是模型转述，可能被漏掉；
          # 结构化字段存在的意义就是"不靠模型复述也拿得到数值"。
          grep -q '"pinn"' api_server.py \
            || { echo "::error::api_server.py must expose the pinn field"; exit 1; }
          grep -q '"pinn"' app.py \
            || { echo "::error::app.py must surface the pinn value"; exit 1; }
          # 中文注释：注入策略是这份系统唯一"给出行动"的结论。后端算了、
          # 前端没画，等于闭环断在最后一步 —— 而页面看起来一切正常，
          # 只是少了一块。所以这里同时钉住"后端下发"与"前端渲染"。
          grep -q '"injection_plan"' api_server.py \
            || { echo "::error::api_server.py must expose the injection_plan field"; exit 1; }
          grep -q 'injection_plan' app.py \
            || { echo "::error::app.py must surface the injection plan"; exit 1; }
          grep -q 'plan_figure' app.py \
            || { echo "::error::app.py must draw the pressure-risk frontier"; exit 1; }
          # 中文注释：后端必须从 workflow 取图，不能回退到 multi_agent_ccus 兼容入口
          # （否则哪天入口 shim 被删，后端会在运行时才炸）。
          grep -q 'from workflow import' api_server.py \
            || { echo "::error::api_server.py must import the graph from workflow"; exit 1; }
          if grep -qE '^from multi_agent_ccus import' api_server.py; then
            echo "::error::api_server.py should not depend on the compatibility shim"; exit 1
          fi
          # 中文注释：HITL 三个接口缺一不可，否则"人工确认"会退化成"全自动放行"。
          for route in '/api/analyze/hitl' '/api/approve' '/api/review/'; do
            grep -q "$route" api_server.py \
              || { echo "::error::api_server.py lost the HITL route $route"; exit 1; }
          done
          grep -q 'interrupt_before' workflow.py \
            || { echo "::error::workflow.py lost the HITL interrupt"; exit 1; }
          # 中文注释：SSE 端点**没有断点**，这是产品契约的一部分而不是实现细节。
          # app_stream 必须是不带 checkpointer 的编译版本：一旦有人给它加上，
          # astream_events 会直接抛 NotImplementedError（SqliteSaver 不支持异步），
          # 而"流式请求不能跨连接续跑"这条契约也就悄悄变了。
          grep -q 'app_stream = workflow.compile()' workflow.py \
            || { echo "::error::app_stream must stay checkpointer-free (no resume on SSE)"; exit 1; }
          # 中文注释：自动放行必须让调用方看得见。后端下发 auto 标记、前端把它
          # 渲染成"未经人工确认"，两件事缺一，一份没人看过的报告就会显示成
          # "评估完成" —— 这正是这套系统最不该犯的错。
          grep -q 'human_review' api_server.py \
            || { echo "::error::api_server.py must expose human_review.auto"; exit 1; }
          grep -q 'human_review' app.py \
            || { echo "::error::app.py must read human_review from the backend"; exit 1; }
          grep -q '未经人工确认' app.py \
            || { echo "::error::app.py must warn that an auto-approved report was not reviewed"; exit 1; }
          echo "Contract OK: frontend is decoupled from domain logic."
