name: CI

# 中文注释：轻量 CI —— 只跑「不需要 Ollama / 模型 / 图谱索引」的检查，秒级完成。
# 重型的端到端测试（需要本地 Ollama + 已建好的图谱）见 e2e.yml，手动触发。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources
        run: python -m compileall -q -f . -x '(^|/)(\.git|models|lightrag_storage|chroma_petro|__pycache__)/'

      - name: Guard against committed secrets
        run: |
          set -e
          # 中文注释：防止把真实 API Key 推上仓库（.env 已被 gitignore，这里兜底）
          if git ls-files | grep -qxE '\.env$'; then
            echo "::error::.env must never be committed"; exit 1
          fi
          if git grep -nIE 'sk-[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{20,}|secret_[A-Za-z0-9]{30,}' \
               -- ':!*.md' ':!*.example' ':!*.lock'; then
            echo "::error::Possible hardcoded API key detected"; exit 1
          fi
          echo "No secrets detected."

      - name: Verify requirements.txt exists and is non-empty
        run: test -s requirements.txt

  unit-core:
    name: Unit tests · core (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 中文注释：这几个模块纯标准库（片段构建 / 文件记忆 / 路由解析），
      # 故意**不装** requirements.txt，保证核心逻辑不受三方包版本漂移影响。
      # 逐个点名而不是 discover：tests/ 下还图表测试，那个需要 matplotlib。
      - name: Run offline unit tests
        run: |
          python -m unittest -v \
            tests.test_fragment_builder \
            tests.test_file_memory \
            tests.test_model_router

  unit-charts:
    name: Unit tests · chart tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文注释：图表工具真的依赖 matplotlib，装它就是承认这个事实，
      # 而不是把测试排除掉假装没有这层依赖。
      # matplotlib 在无显示环境靠 Agg 后端，chart_tools 里已强制设置。
      - name: Install chart dependencies
        run: python -m pip install --quiet matplotlib

      - name: Verify Agg backend is headless-safe
        run: |
          python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          fig, ax = plt.subplots()
          ax.plot([0, 1], [0, 1])
          fig.savefig("/tmp/_probe.png")
          print("Agg backend OK, headless rendering works")
          PY

      - name: Run chart unit tests
        run: python -m unittest -v tests.test_chart_tools

  frontend-contract:
    name: Frontend/backend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check API contract matches frontend client
        run: |
          set -e
          # 中文注释：前端只允许通过 HTTP 调后端，禁止重新引入领域逻辑。
          grep -q 'http://127.0.0.1:8000/api/analyze' app.py \
            || { echo "::error::app.py no longer targets the backend API"; exit 1; }
          grep -q '/api/analyze' api_server.py \
            || { echo "::error::api_server.py lost the /api/analyze route"; exit 1; }
          for banned in langgraph chromadb lightrag ollama sentence_transformers matplotlib; do
            if grep -qiE "^(import|from) +$banned" app.py; then
              echo "::error::app.py must stay a pure HTTP client (found: $banned)"; exit 1
            fi
          done
          echo "Contract OK: frontend is decoupled from domain logic."
