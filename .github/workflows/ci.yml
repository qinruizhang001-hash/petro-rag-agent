name: CI

# 中文注释：轻量 CI —— 只跑「不需要 Ollama / 模型 / 图谱索引」的检查，秒级完成。
# 重型的端到端测试（需要本地 Ollama + 已建好的图谱）见 e2e.yml，手动触发。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources
        run: python -m compileall -q -f . -x '(^|/)(\.git|models|lightrag_storage|chroma_petro|__pycache__)/'

      - name: Guard against committed secrets
        run: |
          set -e
          # 中文注释：防止把真实 API Key 推上仓库（.env 已被 gitignore，这里兜底）
          if git ls-files | grep -qxE '\.env$'; then
            echo "::error::.env must never be committed"; exit 1
          fi
          if git grep -nIE 'sk-[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{20,}|secret_[A-Za-z0-9]{30,}' \
               -- ':!*.md' ':!*.example' ':!*.lock'; then
            echo "::error::Possible hardcoded API key detected"; exit 1
          fi
          echo "No secrets detected."

      - name: Verify requirements.txt exists and is non-empty
        run: test -s requirements.txt

      - name: Guard against corpus binaries in the repository
        run: |
          set -e
          # 中文注释：语料 PDF 是**输入**，不是代码。18 篇 arXiv 论文就 125 MB，
          # 塞进仓库会让每次 clone 都变慢，而且这些论文各有版权与 DOI。
          # .gitignore 已经挡住新文件，但 gitignore **对已跟踪的文件无效** ——
          # 早期提交过的 5 篇 PDF 就仍然留在版本库里。所以这里再加一道机器守卫：
          # 一旦有人 `git add -f` 或忽略了这条规则，CI 当场失败。
          if git ls-files | grep -qE '^ccus_docs/.*\.pdf$'; then
            echo "::error::ccus_docs/*.pdf must not be tracked (run: git rm --cached ccus_docs/*.pdf)"
            git ls-files | grep -E '^ccus_docs/.*\.pdf$'
            exit 1
          fi
          # 单文件上限 1 MB：仓库里最大的合法文件是 docs/ 下的截图（约 430 KB）。
          # 超过这个量级基本就是把数据/模型/语料误提交了。
          big=$(git ls-files -z | xargs -0 ls -la 2>/dev/null | awk '$5 > 1048576 {print $5, $9}')
          if [ -n "$big" ]; then
            echo "::error::Tracked file larger than 1 MB — corpus and models belong outside git"
            echo "$big"
            exit 1
          fi
          echo "No corpus binaries tracked."

      - name: Guard against print() in the runtime path
        run: |
          set -e
          # 中文注释：print 没有级别、不落盘、没有模块归属，线上出问题既不能按
          # 级别过滤也不能事后回溯。运行链路（节点 / 后端 / 核心库）一律走
          # utils.logging_setup。命令行工具（check_gateway 等）的输出本身就是
          # 产品，保留 print，故不在此列。
          hits=$(grep -rn 'print(' --include='*.py' \
                   nodes/ core/ utils/ tools/ memory/ ops/ \
                   api_server.py api_ops.py workflow.py file_memory.py lightrag_retriever.py \
                 | grep -v 'utils/logging_setup.py' || true)
          if [ -n "$hits" ]; then
            echo "::error::print() found in the runtime path; use log.info/warning instead"
            echo "$hits"
            exit 1
          fi
          echo "No print() in the runtime path."

      - name: Guard print() in chart_tools (CLI entry only)
        run: |
          set -e
          # 中文注释：chart_tools.py 是上一条检查的例外 —— 它既有运行链路
          # （aggregate 节点调 generate_pressure_curve），又有命令行入口
          # （_main，输出本身就是产品），所以不能整文件禁 print，只能按
          # "在哪个函数里"区分。这个区分一开始只写在注释里，结果真漏了：
          # 自动清理的日志用了 print，而那行是在**出图过程中**执行的 ——
          # 用户跑一次评估，清理记录只出现在 stdout，app.log 里一个字都没有。
          # 注释挡不住这种回归，AST 能。
          python scripts/check_print_usage.py

      - name: Guard the import cost of config (no reranker on the config path)
        run: |
          set -e
          # 中文注释：core.config 只读环境变量、建 OpenAI 客户端，不该为了
          # 一个"tiktoken 缺席时的兜底 tokenizer"就在 import 期加载 2.2 GB 的
          # CrossEncoder。utils/tokens 曾经这么干过，后果有两层：
          #   · 任何 `from core.config import ...` 都要等模型加载完；
          #   · 无 torch 的环境（CI、干净 clone）里 config 直接不可导入，
          #     连带 test_model_router / test_evaluate_budget 一起变红，
          #     而红的原因与它们要测的东西毫无关系。
          # 现在改成按需导入，这条检查防它悄悄退回去。
          # 注意必须锚定行首：函数内的按需导入是**正确写法**，
          # 宽松匹配会把它一起判成违规（这个坑第一次写就踩了）。
          if grep -nE '^(from|import)[[:space:]]+core\.reranker' utils/tokens.py; then
            echo "::error::utils/tokens.py must import core.reranker lazily (only when tiktoken is absent)"
            exit 1
          fi
          echo "Config path is free of the reranker."

      - name: Guard the MCP wire
        run: |
          set -e
          # 中文注释：stdio 传输把 JSON-RPC 直接写在 stdout 上，工具函数体里一句
          # print() 就会让客户端解析失败，而报错只显示"无效的 JSON"，极难定位。
          # 这个失败模式在离线单测里看不见（单测走 _execute_tool 打桩），
          # 而能看见它的 test_mcp_client.py 需要 torch + 2.3 GB reranker，
          # 不进 CI。所以这里用静态检查兜底：print 只允许出现在自检函数之后。
          # 注意 grep 必须锚定行首：docstring 里那句 ``print()`` 也会被宽松匹配到。
          test -s mcp_server_ccus.py
          test -s mcp_client_ccus.py
          sel=$(grep -n '^def _selftest' mcp_server_ccus.py | cut -d: -f1)
          if [ -z "$sel" ]; then
            echo "::error::mcp_server_ccus.py lost its --selftest entry (the only place print() is allowed)"
            exit 1
          fi
          bad=$(grep -nE '^[[:space:]]*print\(' mcp_server_ccus.py | cut -d: -f1 | awk -v s="$sel" '$1 < s' || true)
          if [ -n "$bad" ]; then
            echo "::error::print() above _selftest in mcp_server_ccus.py — it will corrupt the stdio JSON-RPC stream"
            exit 1
          fi
          if grep -nE '^[[:space:]]*print\(' mcp_client_ccus.py; then
            echo "::error::print() in mcp_client_ccus.py — the client runs inside the app's runtime path"
            exit 1
          fi
          # 中文注释：v2 把 FastMCP 改名为 MCPServer。如果哪天 requirements 被降级
          # 到 1.x，连接时会 ImportError；这里让它更早、更明确地失败。
          grep -q 'from mcp.server.mcpserver import MCPServer' mcp_server_ccus.py \
            || { echo "::error::mcp_server_ccus.py must use the v2 API (mcp.server.mcpserver.MCPServer)"; exit 1; }
          echo "MCP wire is clean."

      - name: Verify container deployment files
        run: |
          set -e
          # 中文注释：一键部署是"生产级"的硬门槛，删掉/改坏必须当场发现，
          # 而不是等用户 docker compose up 时才报错。
          test -s Dockerfile || { echo "::error::Dockerfile missing"; exit 1; }
          test -s docker-compose.yml || { echo "::error::docker-compose.yml missing"; exit 1; }
          test -s .env.docker || { echo "::error::.env.docker missing (compose env_file)"; exit 1; }
          grep -q '^FROM python:3.10-slim' Dockerfile \
            || { echo "::error::Dockerfile must be based on python:3.10-slim"; exit 1; }
          grep -q 'EXPOSE 8000 8501' Dockerfile \
            || { echo "::error::Dockerfile must expose 8000 (API) and 8501 (UI)"; exit 1; }
          grep -q 'api_server:api' Dockerfile \
            || { echo "::error::Dockerfile must start api_server (the ASGI object is named api)"; exit 1; }
          for svc in 'backend:' 'frontend:' 'nginx:'; do
            grep -q "^  $svc" docker-compose.yml \
              || { echo "::error::docker-compose.yml lost service $svc"; exit 1; }
          done
          # 中文注释：Ollama 刻意**不在**栈里。这台机器 15.5 GB 内存，后端那 2.2 GB
          # 的 reranker 已经占住一大块；再起一个常驻 Ollama 会挤到换页，而容器里的
          # Ollama 拿不到 GPU，7B 模型退回 CPU 后一次评估从 70 秒变成几分钟。
          # 所以它跑在宿主机上，后端经 host.docker.internal 访问。
          if grep -qE '^  ollama:' docker-compose.yml; then
            echo "::error::do not add a second Ollama to the stack — see the compose header (16 GB host, no GPU passthrough)"; exit 1
          fi
          grep -q 'streamlit' docker-compose.yml \
            || { echo "::error::docker-compose.yml must start the Streamlit frontend"; exit 1; }
          # 中文注释：容器网络契约。服务名就是主机名 —— 前端写 localhost:8000
          # 会连到它自己，症状是页面一直"后端未连接"，而两个容器各自都健康。
          # 这个错误在本地跑不出来，只有进容器才暴露，所以必须静态拦住。
          grep -q 'API_BASE_URL: http://backend:8000' docker-compose.yml \
            || { echo "::error::frontend must reach the API at http://backend:8000"; exit 1; }
          grep -q 'OLLAMA_BASE_URL: http://host.docker.internal:11434/v1' docker-compose.yml \
            || { echo "::error::backend must reach the host Ollama at http://host.docker.internal:11434/v1"; exit 1; }
          grep -q 'host.docker.internal:host-gateway' docker-compose.yml \
            || { echo "::error::backend needs extra_hosts so host.docker.internal also resolves on Linux"; exit 1; }
          if grep -qE 'API_BASE_URL: *http://(127\.0\.0\.1|localhost)' docker-compose.yml; then
            echo "::error::frontend API_BASE_URL must use the service name, not loopback"; exit 1
          fi
          # 中文注释：chromadb 的默认路径是 Windows 绝对路径 D:\python-learn\chroma_petro，
          # 在 Linux 容器里不覆盖会建出一个名字带反斜杠的目录 —— 不报错，只是永远查不到东西。
          grep -q 'CCUS_CHROMA_PATH: /app/chroma_petro' docker-compose.yml \
            || { echo "::error::CCUS_CHROMA_PATH must be overridden for the container filesystem"; exit 1; }
          # 中文注释：worker 数必须是 1，这是 checkpoint.db 的写者约束，不是内存调参。
          # SqliteSaver 跨进程没有互斥：两个 worker 并发写同一个库会以
          # "attempt to write a readonly database" 失败（实测 3/1200 次写，
          # 加 WAL + busy_timeout 也一样）。失败点在每个节点的 checkpoint 写入，
          # 所以后果是任意一次评估可能中途崩掉，不只是 HITL 续跑失败。
          # 并发由 asyncio + 线程池承担，不需要多进程。
          grep -q 'WEB_CONCURRENCY: 1' docker-compose.yml \
            || { echo "::error::WEB_CONCURRENCY must be 1: SqliteSaver has no cross-process write lock"; exit 1; }
          if grep -q 'WEB_CONCURRENCY: 2' docker-compose.yml; then
            echo "::error::two workers write the same checkpoint.db; measured failures at 3/1200 writes"; exit 1
          fi
          # 中文注释：memory/ 是本仓库的 Python 包（memory_manager.py 等）。
          # 容器里的文件记忆必须挂在别的目录名上 —— 排除或挂掉 memory/ 会让
          # 镜像里的代码直接消失，而报错会指向 ImportError，与 Docker 无关。
          if grep -qE '^memory/?$' .dockerignore; then
            echo "::error::.dockerignore must not exclude memory/ — it is a Python package"; exit 1
          fi
          if grep -qE '\./memory:/' docker-compose.yml; then
            echo "::error::do not mount over memory/ — it is a Python package, not a data dir"; exit 1
          fi
          # 中文注释：file_memory.py 用 os.replace 做原子重写，而 os.replace 作用在
          # bind mount 的**文件**上会 EBUSY。所以记忆必须挂目录。
          if grep -qE '^\s+- \./project_history\.md:' docker-compose.yml; then
            echo "::error::mount ./state as a directory, not project_history.md as a file (os.replace gets EBUSY)"; exit 1
          fi
          grep -q 'PROJECT_HISTORY_PATH: /app/state/' docker-compose.yml \
            || { echo "::error::file memory must point at the mounted ./state directory"; exit 1; }
          # 中文注释：统一入口。外部只该看到一个端口，nginx 负责 /api/ 与 / 的分流。
          grep -q '^  nginx:' docker-compose.yml \
            || { echo "::error::docker-compose.yml lost the nginx gateway"; exit 1; }
          test -s nginx.conf || { echo "::error::nginx.conf missing"; exit 1; }
          grep -q 'proxy_pass http://backend;' nginx.conf \
            || { echo "::error::nginx must route /api/ to the backend upstream"; exit 1; }
          grep -q 'proxy_pass http://frontend;' nginx.conf \
            || { echo "::error::nginx must route / to the frontend upstream"; exit 1; }
          # 中文注释：SSE 与 WebSocket 是两处"不写就坏"的配置。
          # 少了 proxy_buffering off，流式报告会攒到最后一次性吐出；
          # 少了 Upgrade/Connection，Streamlit 页面永远停在 Please wait。
          grep -q 'proxy_buffering off;' nginx.conf \
            || { echo "::error::nginx must disable proxy_buffering for SSE"; exit 1; }
          grep -q 'proxy_set_header Upgrade' nginx.conf \
            || { echo "::error::nginx must forward Upgrade for Streamlit websockets"; exit 1; }
          # 中文注释：proxy_pass 带 URI 后缀会把 /api 前缀吃掉，后端路由是 /api/...
          if grep -qE 'proxy_pass http://backend/;' nginx.conf; then
            echo "::error::proxy_pass must not carry a URI suffix (it would strip /api)"; exit 1
          fi
          # 中文注释：生产进程模型。gunicorn 的 master 会拉起崩溃的 worker，
          # 而 uvicorn --workers 只是起 N 个互不管理的进程。
          grep -q 'gunicorn' docker-compose.yml \
            || { echo "::error::backend must run under gunicorn"; exit 1; }
          grep -q 'api_server:api' docker-compose.yml \
            || { echo "::error::backend command must point at api_server:api"; exit 1; }
          test -s gunicorn.conf.py || { echo "::error::gunicorn.conf.py missing"; exit 1; }
          grep -q 'uvicorn_worker.UvicornWorker' gunicorn.conf.py \
            || { echo "::error::gunicorn.conf.py must use the maintained uvicorn-worker class"; exit 1; }
          # 中文注释：gunicorn 默认 timeout=30s，而一次评估要 90-150s。
          # 不显式调大，worker 会在报告生成到一半时被杀掉。
          grep -qE '^timeout = (9[0-9]{2}|[1-9][0-9]{3,})' gunicorn.conf.py \
            || { echo "::error::gunicorn timeout must exceed the longest assessment (>=900s)"; exit 1; }
          # 中文注释：鉴权。前后端必须读同一个 token 来源，否则线上就是 401。
          grep -q 'API_TOKEN' .env.docker \
            || { echo "::error::.env.docker must define API_TOKEN"; exit 1; }
          grep -q 'require_token' api_server.py \
            || { echo "::error::api_server.py lost the bearer-token dependency"; exit 1; }
          grep -q 'AUTH_HEADERS' app.py \
            || { echo "::error::app.py must send the bearer token to the backend"; exit 1; }
          grep -q 'env_file' docker-compose.yml \
            || { echo "::error::frontend and backend must share one env_file for API_TOKEN"; exit 1; }
          echo "Container deployment files OK."

      - name: Guard the README's own numbers
        run: |
          # 中文注释：README 用五处声明同一个测试总数，曾经分别写着 1080、1106、
          # 989 —— 三个不同的数并存了几个月。没有断言在核对，所以没有东西会失败。
          # 这里只查**内部一致性**（各处是否说同一个数、分项之和是否等于总数），
          # 不查"是否等于真实测试数" —— 那要装 torch，与本 job 的前提冲突。
          python scripts/check_readme_numbers.py

      - name: Guard the package boundary (no logic back-flow into the entry shim)
        run: |
          set -e
          # 中文注释：multi_agent_ccus.py 现在是纯入口转发。这条检查防的是
          # "临时在入口文件里加个函数"慢慢把它养回 65 KB 巨石文件 ——
          # 那种回流不会报错，只会在几个月后让解耦白做。
          lines=$(wc -l < multi_agent_ccus.py)
          if [ "$lines" -gt 40 ]; then
            echo "::error::multi_agent_ccus.py grew to $lines lines; logic belongs in core/ nodes/ utils/"
            exit 1
          fi
          if grep -qE '^(def |class )' multi_agent_ccus.py; then
            echo "::error::multi_agent_ccus.py must stay an entry shim (no defs/classes)"
            exit 1
          fi
          grep -q 'from workflow import app' multi_agent_ccus.py \
            || { echo "::error::entry shim must re-export app from workflow"; exit 1; }
          # 图结构只能有一处定义：节点注册 / 边 / 条件路由 / 编译都在 workflow.py。
          # 早期那份自包含 demo（app_ui.py）自带第二份图，靠这个 job 开排除口子
          # 才活着 —— 排除口子等于"双源合法化"，所以 demo 已删除。
          # 现在没有任何例外：除 workflow.py 外，出现图构造即失败。
          for pat in 'add_node\(' 'add_edge\(' 'add_conditional_edges\(' 'workflow\.compile\('; do
            hits=$(grep -rlE "$pat" --include='*.py' . \
                     | grep -v '^\./workflow\.py$' \
                     | grep -v '^\./_refactor' || true)
            if [ -n "$hits" ]; then
              echo "::error::graph construction must live in workflow.py only; found in: $hits"
              exit 1
            fi
          done
          echo "Package boundary OK."

      # 中文注释：Python 侧的许可证审查。用 --from-pypi 读 PyPI 元数据而不是
      # 已安装包：requirements.txt 里有 sentence-transformers（拖 torch），
      # 装一遍要几个 GB，而这个 job 的契约是"秒级、不装任何依赖"。
      #
      # 判定的重点不是"有没有 GPL 这几个字母"，而是 docs/license-exceptions.json
      # 里登记的例外是否仍然成立、是否已经过期。一个不会过期的例外表
      # 等价于没有审查。
      - name: Dependency licences are commercially usable (Python)
        run: python scripts/audit_python_licenses.py --from-pypi

  unit-core:
    name: Unit tests · core (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 中文注释：这几个模块纯标准库（片段构建 / 文件记忆 / 状态定义 / 路由解析 /
      # 上下文压缩 / 成本核算 / 物理规则 / 日志配置 / 文本清洗 /
      # 实体别名归并 / 图谱连通性分析 / 并行分支合并降级 / 退避重试 /
      # PINN 问句抽取 / 经验库解析与排序 / 时间维度冲突检测 /
      # 蒙特卡洛不确定性量化 / 地应力与断层活化 / CO₂ 物性 /
      # 相渗与两相流 / 盖层封闭性 / 储层模拟器契约 / 深层物理接线 /
      # 先验分布与参数相关性（copula）/ Sobol 敏感性 / 风险决策阈值 /
      # 注入策略优化（约束求解，含与 UQ 判据的逐样本一致性）/
      # 孔隙弹性应力路径（与保守口径的单调性对比）/
      # 消融对照（含"补丁是否真的到达调用点"与"三组结果是否互相覆盖"）/
      # checkpoint 库的写者约束（WAL / busy_timeout 是否真的设上、worker 数是否
      # 被强制降为 1、compose 是否与代码一致）/
      # 全链编排（任务拆分、子 Agent 失败不拖垮整链、周报期数不足、耦合偏离不阻断）），
      # 故意**不装** requirements.txt，保证核心逻辑不受三方包版本漂移影响。
      # 逐个点名而不是 discover：tests/ 下还有图表测试，那个需要 matplotlib。
      #
      # 反例（2026-10 踩过）：把 test_eval_ragas / test_evaluate_budget 塞进来，
      # 这个 job 立刻在三个 Python 版本上全红 —— 前者要 ragas + numpy，
      # 后者经 core.config 拉 openai + dotenv。需要三方包的测试请放 unit-deps。
      - name: Run offline unit tests
        run: |
          python -m unittest -v \
            tests.test_fragment_builder \
            tests.test_kb_evidence \
            tests.test_file_memory \
            tests.test_state \
            tests.test_context_pruner \
            tests.test_cost_model \
            tests.test_physics_rules \
            tests.test_physics_audit \
            tests.test_geomechanics \
            tests.test_co2_properties \
            tests.test_relperm \
            tests.test_flow1d \
            tests.test_caprock \
            tests.test_reservoir_backend \
            tests.test_physics_deep \
